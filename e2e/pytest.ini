[pytest]
testpaths = .
timeout = 120
timeout_method = thread
markers =
    smoke: fast smoke tests for critical navigation paths
    vm: changes the PC; only on a throwaway VM (AT_E2E_APPLY=1)
    ru: run with AT_LANG=ru to check the Russian interface
    first_run: starts with the first-run setup guide (SetupDone cleared)
addopts = -v --tb=short --html=artifacts/report.html --self-contained-html
